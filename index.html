<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>縦書きエディタ</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="toolbar">
        <div class="ctl">
          <label for="preset">判型</label>
          <select id="preset">
            <option value="20,20">原稿用紙　20字 × 20行</option>
            <option value="20,10">原稿用紙ペラ　20字 × 10行</option>
            <option value="42,16">文庫　42字 × 16行</option>
            <option value="43,17">新書　43字 × 17行</option>
            <option value="44,18">四六判　44字 × 18行</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="ctl">
          <label for="chars">字数</label>
          <input type="number" id="chars" min="5" max="80" value="20" />
        </div>
        <div class="ctl">
          <label for="lines">行数</label>
          <input type="number" id="lines" min="3" max="40" value="20" />
        </div>
        <div class="ctl">
          <label for="cell">文字サイズ</label>
          <input type="range" id="cell" min="8" max="48" value="24" />
          <label class="sub"><input type="checkbox" id="fitHeight" checked /> 画面に合わせる</label>
        </div>
        <div class="ctl">
          <label for="step">行送り</label>
          <input type="range" id="step" min="16" max="70" value="38" />
        </div>
        <div class="ctl">
          <label for="font">書体</label>
          <select id="font"></select>
        </div>
        <div class="ctl">
          <label for="gridMode">マス目</label>
          <select id="gridMode">
            <option value="grid-full">升目</option>
            <option value="grid-rules">行罫のみ</option>
            <option value="grid-page">ページ区切りのみ</option>
            <option value="">なし</option>
          </select>
        </div>
        <div class="ctl">
          <label for="markStyle">マーカー</label>
          <select id="markStyle">
            <option value="h">蛍光ペン（淡い）</option>
            <option value="h2">蛍光ペン（濃い）</option>
            <option value="sr">傍線（右・日本語の慣習）</option>
            <option value="u">傍線（左）</option>
            <option value="d">傍線（左・破線）</option>
            <option value="hu">蛍光ペン＋傍線（左）</option>
            <option value="c">文字色</option>
          </select>
        </div>
        <div class="ctl pos-toggles">
          <label>対象品詞</label>
          <div class="checks">
            <label><input type="checkbox" data-pos="adverb" checked /> 副詞</label>
            <label><input type="checkbox" data-pos="adjective" checked /> 形容詞</label>
            <label><input type="checkbox" data-pos="adjectivalnoun" checked /> 形容動詞</label>
            <label><input type="checkbox" data-pos="adnominal" /> 連体詞</label>
          </div>
        </div>
        <div class="ctl">
          <label>&nbsp;</label>
          <div class="row">
            <button id="btnMarker" class="toggle is-on" type="button">マーカー表示</button>
            <button id="btnNormalize" type="button" title="ダーシ U+2014 と半角英数を全角に寄せます">正規化</button>
          </div>
        </div>
      </header>

      <main class="viewport" id="viewport">
        <div
          class="paper grid-full"
          id="paper"
          contenteditable="plaintext-only"
          spellcheck="false"
        ></div>
      </main>

      <footer class="statusbar">
        <span id="status-count">—</span>
        <span id="status-page">—</span>
        <span id="status-mark">—</span>
        <span id="status-msg" class="grow"></span>
      </footer>
    </div>
  </body>
</html>

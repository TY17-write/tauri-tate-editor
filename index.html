<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- 印刷（PDF 出力）のときだけ効く。確かめたいときは media を all にする -->
    <link rel="stylesheet" href="/src/print.css" media="print" id="printStyles" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>縦書きエディタ</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="toolbar">
        <div class="ctl">
          <label>ファイル</label>
          <div class="row">
            <button id="btnOpen" type="button" title="Ctrl+O">開く</button>
            <button id="btnSave" type="button" title="Ctrl+S">保存</button>
            <button id="btnSaveAs" type="button" title="Ctrl+Shift+S">名前を付けて</button>
            <button id="btnFind" type="button" title="Ctrl+F">検索</button>
            <button id="btnOutline" type="button" title="Ctrl+G">目次</button>
            <button id="btnReport" type="button">文体</button>
            <button id="btnPrint" type="button" title="Ctrl+P　PDF にも出せます">印刷</button>
          </div>
        </div>
        <div class="ctl">
          <label for="notation">記法</label>
          <select id="notation"></select>
        </div>
        <div class="ctl">
          <label>表示</label>
          <div class="row">
            <button id="modeSource" class="toggle is-on" type="button" title="Ctrl+E">記法</button>
            <button id="modePreview" class="toggle" type="button" title="Ctrl+E">プレビュー</button>
          </div>
        </div>
        <div class="ctl">
          <label for="preset">判型</label>
          <select id="preset">
            <option value="20,20">原稿用紙　20字 × 20行</option>
            <option value="20,10">原稿用紙ペラ　20字 × 10行</option>
            <option value="42,16">文庫　42字 × 16行</option>
            <option value="43,17">新書　43字 × 17行</option>
            <option value="44,18">四六判　44字 × 18行</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="ctl">
          <label for="chars">字数</label>
          <input type="number" id="chars" min="5" max="80" value="20" />
        </div>
        <div class="ctl">
          <label for="lines">行数</label>
          <input type="number" id="lines" min="3" max="40" value="20" />
        </div>
        <div class="ctl">
          <label for="font">書体</label>
          <select id="font"></select>
        </div>
        <div class="ctl">
          <label for="theme">配色</label>
          <select id="theme"></select>
        </div>
        <div class="ctl">
          <label for="gridMode">マス目</label>
          <select id="gridMode">
            <option value="grid-full">升目</option>
            <option value="grid-rules">行罫のみ</option>
            <option value="grid-page">ページ区切りのみ</option>
            <option value="">なし</option>
          </select>
        </div>
        <div class="ctl">
          <label for="markStyle">マーカー</label>
          <select id="markStyle">
            <option value="h">蛍光ペン（淡い）</option>
            <option value="h2">蛍光ペン（濃い）</option>
            <option value="sr">傍線（右・日本語の慣習）</option>
            <option value="u">傍線（左）</option>
            <option value="d">傍線（左・破線）</option>
            <option value="hu">蛍光ペン＋傍線（左）</option>
            <option value="c">文字色</option>
          </select>
        </div>
        <div class="ctl pos-toggles">
          <label>対象品詞</label>
          <div class="checks">
            <label><input type="checkbox" data-pos="adverb" checked /> 副詞</label>
            <label><input type="checkbox" data-pos="adjective" checked /> 形容詞</label>
            <label><input type="checkbox" data-pos="adjectivalnoun" checked /> 形容動詞</label>
            <label><input type="checkbox" data-pos="adnominal" /> 連体詞</label>
          </div>
        </div>
        <div class="ctl">
          <label>&nbsp;</label>
          <div class="row">
            <button id="btnMarker" class="toggle is-on" type="button">マーカー表示</button>
            <button id="btnNormalize" type="button" title="ダーシ U+2014 と半角英数を全角に寄せます">正規化</button>
            <button id="btnSynonym" type="button" title="Ctrl+I　キャレット位置の語の類義語">類語</button>
          </div>
        </div>
      </header>

      <div class="findbar" id="findbar" hidden>
        <label class="ctl">
          <span>検索</span>
          <input type="search" id="findQuery" placeholder="探す文字列" autocomplete="off" />
        </label>
        <label class="ctl">
          <span>置換</span>
          <input type="text" id="findReplace" placeholder="置き換える文字列" autocomplete="off" />
        </label>
        <div class="row">
          <button id="findPrev" type="button" title="Shift+Enter">前へ</button>
          <button id="findNext" type="button" title="Enter">次へ</button>
          <button id="findReplaceOne" type="button">置換</button>
          <button id="findReplaceAll" type="button">すべて置換</button>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="findRegex" /> 正規表現</label>
          <label><input type="checkbox" id="findCase" /> 大小を区別</label>
        </div>
        <span id="findCount" class="find-count">—</span>
        <button id="findClose" type="button" class="find-close" title="Esc">×</button>
      </div>

      <div class="workspace">
        <aside class="outline" id="outline" hidden>
          <div class="outline-head">
            <span>目次</span>
            <button id="outlineClose" type="button" title="閉じる">×</button>
          </div>
          <ul class="outline-list" id="outlineList"></ul>
          <p class="outline-hint">
            行頭に <code>＃</code> を置くと見出しになります。<br />
            数を増やすと下の階層になります。<br />
            半角の <code>#</code> でも認識しますが、その行だけ升からずれます。
          </p>
        </aside>

        <aside class="report" id="report" hidden>
          <div class="outline-head">
            <span>文体</span>
            <button id="reportRefresh" type="button" title="調べ直す">⟳</button>
            <button id="reportClose" type="button" title="閉じる">×</button>
          </div>
          <div class="report-summary" id="reportSummary"></div>

          <details class="report-settings" id="reportSettings">
            <summary>しきい値</summary>
            <div class="settings-body">
              <label>
                <span>長い文</span>
                <input type="number" id="optLongSentence" min="20" max="1000" step="10" />
                <span class="unit">字を超えたら</span>
              </label>
              <label>
                <span>文末の重なり</span>
                <input type="number" id="optRepeatEndings" min="2" max="10" />
                <span class="unit">文続いたら</span>
              </label>
              <label>
                <span>近くの繰り返し</span>
                <input type="number" id="optNearbyWindow" min="10" max="400" step="10" />
                <span class="unit">字以内なら</span>
              </label>
              <label>
                <span>使いすぎ</span>
                <input type="number" id="optOverusePer1000" min="0.5" max="50" step="0.5" />
                <span class="unit">回/千字から</span>
              </label>
              <label class="stack">
                <span>数える語（1 行に 1 つ）</span>
                <textarea id="optOveruseWords" rows="6" spellcheck="false"></textarea>
              </label>
              <div class="row">
                <button id="optReset" type="button">既定に戻す</button>
              </div>
            </div>
          </details>

          <div class="report-filter" id="reportFilter"></div>
          <ul class="report-list" id="reportList"></ul>
        </aside>

        <main class="viewport" id="viewport">
          <div
            class="paper grid-full"
            id="paper"
            contenteditable="plaintext-only"
            spellcheck="false"
          ></div>
        </main>
      </div>

      <!-- ルビ入力の小窓。
           読みは本文（rt）に直に打たせない。rt の中では日本語入力が
           続かず、変換を始めた時点で入力が外れてしまうため。 -->
      <div id="rubyBox" class="rubybox" hidden>
        <span class="rubybox-base" id="rubyBase"></span>
        <label for="rubyReading">読み</label>
        <input id="rubyReading" type="text" autocomplete="off" spellcheck="false" />
        <span class="rubybox-hint">Enter 確定 / Esc 取消　空で外す</span>
      </div>

      <!-- 類義語の小窓。Ctrl+T で開き、候補をクリックすると置き換える -->
      <div id="synBox" class="synbox" hidden>
        <div class="synbox-head">「<span id="synWord"></span>」の類義語</div>
        <div class="synbox-list" id="synList"></div>
        <span class="rubybox-hint">クリックで置き換え / Esc 閉じる</span>
      </div>

      <footer class="statusbar">
        <span id="status-file">新規</span>
        <span id="status-count">—</span>
        <span id="status-page">—</span>
        <span id="status-mark">—</span>
        <span id="status-msg" class="grow"></span>
      </footer>
    </div>
  </body>
</html>

[package]
name = "tauri-tate-editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_tate_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 辞書を実行ファイルに埋め込むためビルド成果物が非常に大きい
# （debug で 9 GB 前後）。増分ビルドの中間ファイルがさらに 2 GB ほど
# 積み上がり、ディスクが逼迫してビルドが失敗したため切っている。
# 一度に作り直すぶん多少遅くなるが、容量のほうが問題になりやすい。
[profile.dev]
incremental = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thunderdome = "0.6.1"
encoding_rs = "0.8.35"
once_cell = "1.21.4"
# 辞書は UniDic から SudachiDict に切り替えた。SudachiDict は語ごとに
# 同義語グループを持つ辞書系列で、のちに類義語検索を載せるための布石。
lindera = { version = "6.0.0", features = ["embed-sudachidict"] }
tauri-plugin-dialog = "2"
regex = "1.13.1"
fontdb = "0.24.0"
ttf-parser = "0.25"

